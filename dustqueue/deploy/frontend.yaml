AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 origin and CloudFront OAC for the DustQueue Vite frontend.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: Serve the compiled DustQueue single-page app from a private regional S3 bucket through CloudFront.
    must:
      - Keep the bucket private and permit reads only through this stack's CloudFront distribution.
      - Create regional resources in the selected AWS Region; CloudFront is global.
      - Preserve frontend assets if the stack is deleted.
Parameters:
  ProjectName:
    Type: String
    Default: dustqueue
    AllowedPattern: '^[a-z0-9-]{1,32}$'
    Description: Lowercase project prefix used in the generated bucket name.
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Store immutable frontend build artifacts privately in the selected Region.
        must:
          - Enable all public access blocks, encryption, versioning, and HTTPS-only access.
        mutability: Retained on stack deletion and replacement.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: Sign CloudFront origin requests with SigV4 so S3 remains private.
        must:
          - Use always-signing S3 origin requests over HTTPS.
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: !Sub 'OAC for ${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Provide the public HTTPS endpoint and cache for the single-page frontend.
        must:
          - Redirect HTTP to HTTPS.
          - Return index.html for SPA route fallbacks.
          - Use the private S3 bucket through the OAC above.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'DustQueue frontend (${AWS::StackName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Restrict object reads to this CloudFront distribution and require TLS for every S3 request.
        must:
          - Avoid public or account-wide object read access.
          - Scope CloudFront access by distribution ARN and owning account.
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
Outputs:
  FrontendBucketName:
    Description: Private S3 bucket for frontend assets.
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidation.
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: HTTPS URL for the deployed frontend.
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  CloudFrontDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt FrontendDistribution.DomainName
